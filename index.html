<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lord of the Rings</title>
    <link rel="stylesheet" href="indexstyle.css">
</head>
<body>
<!-- saati login classının dışına yazabilir misin ayrı bir bölüm gibi -->
<!-- Saat Divi -->
<div id="clock" class="clock"></div>

<!-- Yüzük ve Login ekranı -->
<input type="checkbox" id="toggle">
<label for="toggle" class="ring"></label>

<div class="login">
    <h3 class="elvish-text">ᚨᛊᚺ ᚾᚨᛉᚷ ᛞᚢᚱᛒᚨᛏᚢᛚûᚲ ᚨᛊᚺ ᚾᚨᛉᚷ ᚷᛁᛗᛒᚨᛏᚢᛚ ᚨᛊᚺ ᚾᚨᛉᚷ ᛏᚺᚱᚨᚲᚨᛏᚢᛚûᚲ ᚨᚷᚺ ᚲᚱᛁᛗᛈᚨᛏᚢᛚ</h3>
    <h2>Giriş Yap</h2>
    <input type="text" id="username" placeholder="Kullanıcı Adı">
    <input type="password" id="password" placeholder="Şifre">
    <button id="loginButton">Giriş</button>
    <label for="toggle" class="back-button">
        <div class="yellow-oval"></div>
        <div class="oval"></div>
    </label>
</div>
<script src="indexscript.js"></script>

</body>
</html>
